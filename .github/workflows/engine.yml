name: Engine integration
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  engine:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            10.0.402
      - run: python -m pip install -r requirements-test.txt
      - run: python -m unittest discover -s tests
      - run: dotnet run --project tests/Sevenfall.DefenseTests -c Release
      - run: python scripts/build.py build
      - run: python scripts/audit_release_dependencies.py --require-independent
      - uses: actions/upload-artifact@v4
        with:
          name: release-dependencies-${{ matrix.os }}
          path: artifacts/release-dependencies.json
