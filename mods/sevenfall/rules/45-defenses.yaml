# Generated by scripts/build_defenses.py. Original Sevenfall defense roster.
^SF_EMPLACEMENT:
	Inherits: ^Defense
	Inherits@SF_SHAPE: ^2x2Shape
	Building:
		Dimensions: 2,2
		Footprint: xx xx
	Selectable:
		Bounds: 2048, 2048
	-SpawnActorsOnSell:
	WithSpriteBody:
	WithTextDecoration@OWNER:
		Text: ===
		UsePlayerColor: True
		Position: BottomRight
		ValidRelationships: Ally, Neutral, Enemy
		RequiresSelection: False
	RevealsShroud:
		Range: 6c0
	Armor:
		Type: Heavy

^SF_WALL:
	Inherits: ^Wall
	-WithWallSpriteBody:
	WithSpriteBody:
	RevealsShroud:
		Range: 2c0
		Type: CenterPosition
	Armor:
		Type: Wood

A_DAWNWALL:
	Inherits: ^SF_WALL
	Inherits@SF_POWER: ^DisableOnLowPower
	RenderSprites:
		Image: a_dawnwall
	Buildable:
		Queue: Defense
		BuildPaletteOrder: 10
		Prerequisites: anypower, ~sf.angels, ~techlevel.infonly
		Description: sf-a-dawnwall-description
	Tooltip:
		Name: sf-a-dawnwall-name
	Valued:
		Cost: 100
	Health:
		HP: 24000
	Power:
		Amount: -8
	LineBuild:
		NodeTypes: a_dawnwall
	LineBuildNode:
		Types: a_dawnwall
	Building:
		Footprint: =
	-Crushable:
	WithSpriteBody:
		RequiresCondition: !disabled
	WithSpriteBody@OFF:
		Name: offline
		Sequence: offline
		RequiresCondition: disabled
	Targetable:
		TargetTypes: GroundActor, Structure, Wall, Defense
	SFDefenseSource:
		Kind: Light
		Range: 0c640
		Damage: 500000
		Heal: 0
		RequiresCondition: !disabled
	WithRangeCircle@SF_AURA:
		Range: 0c640
		Type: a_dawnwall
		Color: 86E7FF80
	WithColoredOverlay@SF_OFFLINE:
		Color: 00000090
		RequiresCondition: disabled

