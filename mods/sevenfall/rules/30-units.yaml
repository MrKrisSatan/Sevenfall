# All implemented units use original Sevenfall directional artwork.
# Animated bodies are bound in 35-animations.yaml. Combat tuning is explicit here.
# Main-faction units
A_WATCHER:
	Inherits: E1
	RenderSprites:
		Image: a_watcher
	WithTextDecoration@OWNER:
		Text: ===
		UsePlayerColor: True
		Position: BottomRight
		ValidRelationships: Ally, Neutral, Enemy
		RequiresSelection: False
	WithInfantryBody:
		IdleSequences: stand
		StandSequences: stand
		DefaultAttackSequence: shoot
	-WithDeathAnimation:
	Parachutable:
		-GroundCorpseSequence:
	Armament@GARRISONED:
		-MuzzleSequence:
		Weapon: SF_HaloLance
	Buildable:
		Queue: Infantry
		BuildAtProductionType: Soldier
		BuildPaletteOrder: 10
		Prerequisites: a_chapel, ~sf.angels, ~techlevel.infonly
		Description: sf-a-watcher-description
		BuildDurationModifier: 75
	Tooltip:
		Name: sf-a-watcher-name
	Valued:
		Cost: 200
	Health:
		HP: 9000
	Mobile:
		Speed: 72
	Armament@PRIMARY:
		Weapon: SF_HaloLance
	ChangesHealth@SF_RENEWAL:
		Step: 0
		PercentageStep: 1
		Delay: 25
		StartIfBelow: 100
		DamageCooldown: 200

