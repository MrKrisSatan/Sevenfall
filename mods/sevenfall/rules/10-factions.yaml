# SEVENFALL: selection and tech prerequisites.
# This overlay is loaded after Red Alert's rules/world.yaml.
^BaseWorld:
	PaletteFromGrayscale@sf_rgba:
		Name: sf_rgba
		AllowModifiers: False
	-Faction@allies:
	-Faction@england:
	-Faction@france:
	-Faction@germany:
	-Faction@soviet:
	-Faction@russia:
	-Faction@ukraine:
	-Faction@random:
	-Faction@randomallies:
	-Faction@randomsoviet:
	Faction@a_seraph:
		Name: sf-faction-a-seraph-name
		InternalName: a_seraph
		Side: Angels
		Description: sf-faction-a-seraph-description
	Faction@a_warden:
		Name: sf-faction-a-warden-name
		InternalName: a_warden
		Side: Angels
		Description: sf-faction-a-warden-description
	Faction@a_exile:
		Name: sf-faction-a-exile-name
		InternalName: a_exile
		Side: Angels
		Description: sf-faction-a-exile-description
	Faction@h_bastion:
		Name: sf-faction-h-bastion-name
		InternalName: h_bastion
		Side: Humans
		Description: sf-faction-h-bastion-description
	Faction@h_union:
		Name: sf-faction-h-union-name
		InternalName: h_union
		Side: Humans
		Description: sf-faction-h-union-description
	Faction@h_covenant:
		Name: sf-faction-h-covenant-name
		InternalName: h_covenant
		Side: Humans
		Description: sf-faction-h-covenant-description
	Faction@d_legion:
		Name: sf-faction-d-legion-name
		InternalName: d_legion
		Side: Demons
		Description: sf-faction-d-legion-description
	Faction@d_brood:
		Name: sf-faction-d-brood-name
		InternalName: d_brood
		Side: Demons
		Description: sf-faction-d-brood-description
	Faction@d_court:
		Name: sf-faction-d-court-name
		InternalName: d_court
		Side: Demons
		Description: sf-faction-d-court-description
	Faction@sf_random:
		Name: sf-faction-random-name
		InternalName: Random
		RandomFactionMembers: a_seraph, a_warden, a_exile, h_bastion, h_union, h_covenant, d_legion, d_brood, d_court
		Side: Random
		Description: sf-faction-random-description
	ResourceRenderer:
		ResourceTypes:
			Ore:
				Image: sf_veilglass
				Sequences: rough
				Name: sf-resource-veilglass-rough-name
			Gems:
				Image: sf_veilglass
				Sequences: enriched
				Name: sf-resource-veilglass-enriched-name

World:
	BridgeLayer:
	SFDefenseManager:
	SFVeilglassHazard:
	StartingUnits@mcvonly:
		Factions: a_seraph, a_warden, a_exile, h_bastion, h_union, h_covenant, d_legion, d_brood, d_court
	-StartingUnits@lightallies:
	-StartingUnits@lightsoviet:
	-StartingUnits@heavyallies:
	-StartingUnits@heavysoviet:

^BasePlayer:
	SFHarvestAccounting:
	PlayerResources:
		ResourceValues:
			# Low-grade and high-grade Veilglass, a single mineral.
			Ore: 30
			Gems: 55

FACT:
	TransformsIntoRepairable:
		RepairActors: a_service, h_service, d_service
	RenderSprites:
		Image: h_yard
		FactionImages:
			a_seraph: a_yard
			a_warden: a_yard
			a_exile: a_yard
			h_bastion: h_yard
			h_union: h_yard
			h_covenant: h_yard
			d_legion: d_yard
			d_brood: d_yard
			d_court: d_yard
	Selectable:
		Bounds: 4096, 4267, 0, -768
	-WithBuildingBib:
	-WithDeathAnimation:
	WithTextDecoration@OWNER:
		Text: ===
		UsePlayerColor: True
		Position: BottomRight
		ValidRelationships: Ally, Neutral, Enemy
		RequiresSelection: False
	ProvidesPrerequisite@sf_angels:
		Factions: a_seraph, a_warden, a_exile
		Prerequisite: sf.angels
	ProvidesPrerequisite@sf_humans:
		Factions: h_bastion, h_union, h_covenant
		Prerequisite: sf.humans
	ProvidesPrerequisite@sf_demons:
		Factions: d_legion, d_brood, d_court
		Prerequisite: sf.demons
	ProvidesPrerequisite@sf_a_seraph:
		Factions: a_seraph
		Prerequisite: sf.a_seraph
	ProvidesPrerequisite@sf_a_warden:
		Factions: a_warden
		Prerequisite: sf.a_warden
	ProvidesPrerequisite@sf_a_exile:
		Factions: a_exile
		Prerequisite: sf.a_exile
	ProvidesPrerequisite@sf_h_bastion:
		Factions: h_bastion
		Prerequisite: sf.h_bastion
	ProvidesPrerequisite@sf_h_union:
		Factions: h_union
		Prerequisite: sf.h_union
	ProvidesPrerequisite@sf_h_covenant:
		Factions: h_covenant
		Prerequisite: sf.h_covenant
	ProvidesPrerequisite@sf_d_legion:
		Factions: d_legion
		Prerequisite: sf.d_legion
	ProvidesPrerequisite@sf_d_brood:
		Factions: d_brood
		Prerequisite: sf.d_brood
	ProvidesPrerequisite@sf_d_court:
		Factions: d_court
		Prerequisite: sf.d_court

MCV:
	RenderSprites:
		Image: h_mcv
		FactionImages:
			a_seraph: a_mcv
			a_warden: a_mcv
			a_exile: a_mcv
			h_bastion: h_mcv
			h_union: h_mcv
			h_covenant: h_mcv
			d_legion: d_mcv
			d_brood: d_mcv
			d_court: d_mcv
	WithTextDecoration@OWNER:
		Text: ===
		UsePlayerColor: True
		Position: BottomRight
		ValidRelationships: Ally, Neutral, Enemy
		RequiresSelection: False

MCV.Husk:
	RenderSprites:
		Image: h_mcv
		FactionImages:
			a_seraph: a_mcv
			a_warden: a_mcv
			a_exile: a_mcv
			h_bastion: h_mcv
			h_union: h_mcv
			h_covenant: h_mcv
			d_legion: d_mcv
			d_brood: d_mcv
			d_court: d_mcv

HARV.EmptyHusk:
	RenderSprites:
		Image: h_harvester
		FactionImages:
			a_seraph: a_harvester
			a_warden: a_harvester
			a_exile: a_harvester
			h_bastion: h_harvester
			h_union: h_harvester
			h_covenant: h_harvester
			d_legion: d_harvester
			d_brood: d_harvester
			d_court: d_harvester

HARV.FullHusk:
	RenderSprites:
		Image: h_harvester
		FactionImages:
			a_seraph: a_harvester
			a_warden: a_harvester
			a_exile: a_harvester
			h_bastion: h_harvester
			h_union: h_harvester
			h_covenant: h_harvester
			d_legion: d_harvester
			d_brood: d_harvester
			d_court: d_harvester

^Vehicle:
	Repairable:
		RepairActors: a_service, h_service, d_service

^Ship:
	RepairableNear:
		RepairActors: a_naval, h_naval, d_naval

^Plane:
	Repairable:
		RepairActors: a_service, h_service, d_service

^Infantry:
	SFDreadBar:
	ExternalCondition@SF_DREAD:
		Condition: sf-dread
		TotalCap: 1
	ExternalCondition@SF_WIRE:
		Condition: sf-wire
		TotalCap: 1
	ExternalCondition@SF_THORNS:
		Condition: sf-thorns
		TotalCap: 1
	SpeedMultiplier@SF_WIRE:
		Modifier: 65
		RequiresCondition: sf-wire
	SpeedMultiplier@SF_THORNS:
		Modifier: 50
		RequiresCondition: sf-thorns
	WithColoredOverlay@SF_DREAD:
		Color: B146D268
		RequiresCondition: sf-dread
