# Generated animation bindings. Gameplay weapons and prerequisites remain in 30-units.yaml.
^SF_ANIMATED_DEATH:
	Inherits: ^BasicHusk
	Inherits@SF_SPRITES: ^SpriteActor
	Husk:
		AllowedTerrain: Clear, Rough, Road, Ore, Gems, Beach, Water, River
	QuantizeFacingsFromSequence:
		Sequence: corpse
	WithFacingSpriteBody:
		StartSequence: die
		Sequence: corpse
	KillsSelf:
		Delay: 150
		RemoveInstead: True
	-MapEditorData:
A_AEGIS:
	SpawnActorOnDeath@SF_ANIMATION:
		Actor: a_aegis.death
	WithMoveAnimation:
		MoveSequence: move
	WithAttackAnimation:
		Sequence: shoot
		DelayRelativeTo: Attack
A_AEGIS.DEATH:
	Inherits: ^SF_ANIMATED_DEATH
	RenderSprites:
		Image: a_aegis_death

