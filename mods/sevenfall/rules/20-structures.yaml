# Power buildings and refineries use original PNG artwork.
A_SPIRE:
	Inherits: POWR
	RenderSprites:
		Image: a_spire
	Selectable:
		Bounds: 2730, 4096, 0, -1536
	-WithBuildingBib:
	-WithDeathAnimation:
	WithTextDecoration@OWNER:
		Text: ===
		UsePlayerColor: True
		Position: BottomRight
		ValidRelationships: Ally, Neutral, Enemy
		RequiresSelection: False
	Buildable:
		Queue: Building
		BuildPaletteOrder: 10
		Prerequisites: ~sf.angels, ~techlevel.infonly
		Description: sf-a-spire-description
	Valued:
		Cost: 420
	Tooltip:
		Name: sf-a-spire-name
	Power:
		Amount: 125

